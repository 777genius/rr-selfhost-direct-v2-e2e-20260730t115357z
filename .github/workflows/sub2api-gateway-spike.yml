name: Sub2API private native adoption canary
on:
  workflow_dispatch:
    inputs:
      provider:
        description: One planned provider canary; inspect effects before any new run
        required: true
        type: choice
        options: [mimo, openrouter]
      agent:
        description: Pinned sealed client (Claude supports MiMo only)
        required: true
        default: codex
        type: choice
        options: [codex, claude]
permissions:
  contents: read
  id-token: write
jobs:
  canary:
    runs-on: [self-hosted, rr-sub2-spike-20260930]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify key independent contracts
        run: node --test sub2api-spike/*.test.mjs
      - name: One sealed fixture native review
        working-directory: sub2api-spike
        env:
          SPIKE_PROVIDER: ${{ inputs.provider }}
          SPIKE_AGENT: ${{ inputs.agent }}
        run: |
          node --input-type=module <<'NODE'
          import { spawn } from 'node:child_process';
          import { mkdir, writeFile } from 'node:fs/promises';
          const input = { provider: process.env.SPIKE_PROVIDER, agent: process.env.SPIKE_AGENT,
            oidcURL: process.env.ACTIONS_ID_TOKEN_REQUEST_URL, oidcToken: process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN,
            workflowSHA: process.env.GITHUB_SHA, runID: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT };
          const child = spawn('/usr/bin/sudo', ['-n', '/usr/local/libexec/rr-sub2-canary'], { stdio: ['pipe', 'pipe', 'inherit'] });
          child.stdin.end(JSON.stringify(input));
          let out = '', size = 0;
          child.stdout.on('data', b => { size += b.length; if (size > 65536) child.kill('SIGKILL'); else out += b; });
          const code = await new Promise((resolve, reject) => { child.on('error', reject); child.on('close', resolve); });
          if (code !== 0 || size > 65536) throw Error('Trusted canary failed; inspect effects before any new run');
          const result = JSON.parse(out);
          if (result.result !== 'passed' || result.workflow_sha !== input.workflowSHA) throw Error('Invalid control receipt');
          await mkdir('evidence', { recursive: true });
          await writeFile('evidence/result.json', JSON.stringify(result, null, 2) + '\n');
          NODE
      - name: Publish normalized client evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rr-sub2-spike-20260930-${{ inputs.provider }}-${{ inputs.agent }}
          path: sub2api-spike/evidence/result.json
          if-no-files-found: error
          retention-days: 7
